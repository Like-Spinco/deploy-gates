name: "Frontend deploy"

run-name: "Frontend ${{ inputs.env }}: ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
      run_id:
        description: "Run ID"
        required: true
      sha:
        description: "Commit"
        required: true

permissions: {}

# A newer deploy replaces the buttons still waiting for an older one.
concurrency:
  group: frontend-${{ inputs.env }}
  cancel-in-progress: true

env:
  REPOSITORY: platform
  RUN_ID: ${{ inputs.run_id }}

jobs:
  # No environment, so the links are on the run page before anyone approves.
  info:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - &check
      name: Check inputs
      env:
        ENVIRONMENT: ${{ inputs.env }}
        SHA: ${{ inputs.sha }}
      run: |
        [[ "$ENVIRONMENT" =~ ^[a-z0-9-]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{7,40}$ ]] \
          || { echo "::error::malformed inputs"; exit 1; }

    - name: Links
      env:
        ENVIRONMENT: ${{ inputs.env }}
        SHA: ${{ inputs.sha }}
      run: |
        base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY_OWNER/$REPOSITORY"
        {
          echo "### Frontend \`$ENVIRONMENT\`"
          echo "- Platform run: $base/actions/runs/$RUN_ID"
          echo "- Commit: $base/commit/$SHA"
        } | tee -a "$GITHUB_STEP_SUMMARY"

  switch:
    name: "Switch traffic"
    needs: info
    runs-on: ubuntu-24.04
    environment:
      name: frontend-${{ inputs.env }}
      url: ${{ github.server_url }}/${{ github.repository_owner }}/${{ env.REPOSITORY }}/actions/runs/${{ inputs.run_id }}
    timeout-minutes: 20
    steps:
    - *check

    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts

    - name: Token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GATE_APP_CLIENT_ID }}
        private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
        repositories: ${{ env.REPOSITORY }}
        permission-actions: write

    - name: Switch
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: bash .github/scripts/rerun-job.sh "$GITHUB_REPOSITORY_OWNER/$REPOSITORY" "$RUN_ID" Switch

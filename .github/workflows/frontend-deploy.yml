name: "Frontend deploy"

run-name: "Frontend ${{ inputs.env }}: ${{ inputs.sha }}${{ inputs.stop_only == 'true' && ' · stop old slot' || '' }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
      run_id:
        description: "Run ID"
        required: true
      sha:
        description: "Commit"
        required: true
      stop_only:
        description: "Traffic already moved without approval: only offer to stop the old slot"
        required: false
        default: "false"

permissions: {}

# A newer deploy replaces the buttons still waiting for an older one.
concurrency:
  group: frontend-${{ inputs.env }}
  cancel-in-progress: true

env:
  REPOSITORY: platform
  RUN_ID: ${{ inputs.run_id }}

jobs:
  # No environment, so the links are on the run page before anyone approves.
  info:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - &check
      name: Check inputs
      env:
        ENVIRONMENT: ${{ inputs.env }}
        SHA: ${{ inputs.sha }}
        STOP_ONLY: ${{ inputs.stop_only }}
      run: |
        [[ "$ENVIRONMENT" =~ ^[a-z0-9-]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{7,40}$ && "$STOP_ONLY" =~ ^(true|false)$ ]] \
          || { echo "::error::malformed inputs"; exit 1; }

    # Without reviewers the buttons would act on dispatch, before anyone clicks.
    - name: Check the gate
      env:
        GH_TOKEN: ${{ github.token }}
        ENVIRONMENT: ${{ inputs.env }}
      run: |
        gate="frontend-$ENVIRONMENT"
        rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/$gate" --jq '[.protection_rules[]?.type] | join(",")' 2>/dev/null) \
          || { echo "::error::environment $gate does not exist in $GITHUB_REPOSITORY; create it with required reviewers"; exit 1; }
        [[ ",$rules," == *,required_reviewers,* ]] || { echo "::error::environment $gate has no required reviewers"; exit 1; }

    - name: Links
      env:
        ENVIRONMENT: ${{ inputs.env }}
        SHA: ${{ inputs.sha }}
      run: |
        base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY_OWNER/$REPOSITORY"
        {
          echo "### Frontend \`$ENVIRONMENT\`"
          echo "- Platform run: $base/actions/runs/$RUN_ID"
          echo "- Commit: $base/commit/$SHA"
        } | tee -a "$GITHUB_STEP_SUMMARY"

  switch:
    name: "Switch traffic"
    needs: info
    if: inputs.stop_only != 'true'
    runs-on: ubuntu-24.04
    environment: &environment
      name: frontend-${{ inputs.env }}
      url: ${{ github.server_url }}/${{ github.repository_owner }}/${{ env.REPOSITORY }}/actions/runs/${{ inputs.run_id }}
    timeout-minutes: 20
    steps:
    - *check

    - &checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: .github/scripts

    - &token
      name: Token
      id: token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GATE_APP_CLIENT_ID }}
        private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
        repositories: ${{ env.REPOSITORY }}
        permission-actions: write

    - name: Switch
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: bash .github/scripts/rerun-job.sh "$GITHUB_REPOSITORY_OWNER/$REPOSITORY" "$RUN_ID" Switch

  # Optional: without it the old slot stops at the end of the skew window.
  stop-old:
    name: "Stop the old slot now"
    needs: [info, switch]
    if: ${{ !cancelled() && needs.info.result == 'success' && (needs.switch.result == 'success' || (inputs.stop_only == 'true' && needs.switch.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    environment: *environment
    timeout-minutes: 20
    steps:
    - *check
    - *checkout
    - *token
    - name: Stop
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
      run: bash .github/scripts/rerun-job.sh "$GITHUB_REPOSITORY_OWNER/$REPOSITORY" "$RUN_ID" Switch

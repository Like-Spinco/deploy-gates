name: "Request approval"
description: "Tells whether this run was approved in deploy-gates; if not, opens an Approve button there, and approving it re-runs the named job of this run."

inputs:
  client-id:
    description: "Client ID of the gate GitHub App"
    required: true
  private-key:
    description: "Private key of the gate GitHub App"
    required: true
  environment:
    description: "dev or prod: the button lives in the deploy-gates environment <repository>-<environment>"
    required: true
  sha:
    description: "Commit being released"
    required: true
  job:
    description: "Job of this run that approval re-runs; it deploys only when approved is true"
    required: false
    default: "Approve"

outputs:
  approved:
    description: "true once a reviewer approved this run's button; a re-run without it only asks again"
    value: ${{ steps.check.outputs.approved }}
  url:
    description: "The approval page"
    value: ${{ steps.check.outputs.url || steps.dispatch.outputs.url }}

runs:
  using: composite
  steps:
  - id: token
    uses: actions/create-github-app-token@v3
    with:
      client-id: ${{ inputs.client-id }}
      private-key: ${{ inputs.private-key }}
      owner: ${{ github.repository_owner }}
      repositories: deploy-gates
      permission-actions: write

  - id: check
    shell: bash
    env:
      GH_TOKEN: ${{ steps.token.outputs.token }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.sha }}
    run: |
      gates="$GITHUB_REPOSITORY_OWNER/deploy-gates"
      title="${GITHUB_REPOSITORY#*/} $ENVIRONMENT: $(cut -c1-12 <<<"$SHA") · run $GITHUB_RUN_ID"
      approved=false
      for id in $(gh api "repos/$gates/actions/workflows/approve.yml/runs?event=workflow_dispatch&per_page=100" \
        | jq -r --arg t "$title" '.workflow_runs[] | select(.display_title == $t) | .id'); do
        if gh api "repos/$gates/actions/runs/$id/approvals" | jq -e 'any(.[]; .state == "approved")' >/dev/null; then
          approved=true
          echo "url=$GITHUB_SERVER_URL/$gates/actions/runs/$id" >> "$GITHUB_OUTPUT"
          break
        fi
      done
      echo "approved=$approved" >> "$GITHUB_OUTPUT"
      echo "Approved in deploy-gates: $approved"

  - id: dispatch
    if: steps.check.outputs.approved != 'true'
    shell: bash
    env:
      GH_TOKEN: ${{ steps.token.outputs.token }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.sha }}
      JOB: ${{ inputs.job }}
    run: |
      gates="$GITHUB_REPOSITORY_OWNER/deploy-gates"
      dispatch=$(gh api -X POST "repos/$gates/actions/workflows/approve.yml/dispatches" -f ref=main -F return_run_details=true \
        -f "inputs[repository]=${GITHUB_REPOSITORY#*/}" -f "inputs[env]=$ENVIRONMENT" -f "inputs[run_id]=$GITHUB_RUN_ID" \
        -f "inputs[sha]=$(cut -c1-12 <<<"$SHA")" -f "inputs[job]=$JOB")
      url=$(jq -r '.html_url // empty' <<<"$dispatch" 2>/dev/null || true)
      url=${url:-$GITHUB_SERVER_URL/$gates/actions/workflows/approve.yml}
      echo "url=$url" >> "$GITHUB_OUTPUT"
      echo "::notice title=Waiting for approval::$url"
      echo "Not deployed yet. **[Approve]($url)** in deploy-gates; a re-run of the $JOB job without it only asks again." >> "$GITHUB_STEP_SUMMARY"
